[project]
name = "c2fc"
version = "1.0.0"
description = "C++ -> flowchart (SVG) converter with PyQt6 GUI"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "tree-sitter>=0.23",
    "tree-sitter-cpp>=0.23",
]

[project.gui-scripts]
c2fc-gui = "gui:main"

[project.scripts]
c2fc = "main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
